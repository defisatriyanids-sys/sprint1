<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cookpad</title>
  
  <link rel="stylesheet" href="src/css/style.css">
</head>
<body>
  <header class="header">
    <div class="logo"
   <a href="#"> Cookpad </a>
    </div>
    <nav class="navigation" aria-label="Main Navigation">
      <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">Recipes</a></li>
        <li><a href="#">Categories</a></li>
        <li><a href="#">Community</a></li>
      </ul>
    </nav>
    <div class="buttons">
      <a href="#" class="login-button">Login</a>
      <a href="#" class="register-button">Register</a>
    </div>
  </header>

    <main>
      <section class="hero">
        <div class="hero-content">
          <p class="tag">
            Cook, Share, & Inspire
          </p>

          <h1> Home cooking made simple.</h1>

          <p class="description">
            Discover thousands of recipes from people just like you.
          </p>

          <form class="search-form">
            <label class="sr-only" for="search">Search for recipes</label>
            <input type="text" id="search" name="search" placeholder="Search for recipes">
            <button type="submit">Search</button>
          </form>
        </div>

        <div class="hero-image">
          <img src="src/images/hero-image.jpg" alt="Delicious food">
        </div>
      </section>
    </main>
</body>
</html>
